services:
  - type: web
    name: teacher-scheduling-api
    env: python
    buildCommand: pip install -r requirements.backend.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    autoDeploy: false